<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Grace Chapel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.unsplash.com/photo-1568605114967-8130f3a36994?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5NjAxNDR8MHwxfHNlYXJjaHwxfHxjaHVyY2glMjBpbmteriorfGVufDB8fHx8MTY5NjA4MzA1Mw&ixlib=rb-4.0.3&q=80&w=1920') no-repeat center center fixed;
      background-size: cover;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(61,40,13,0.15);
      padding: 2rem;
      max-width: 28rem;
      text-align: center;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: #3d280d;
    }
    p {
      color: #5c3c10;
      margin-top: 0.5rem;
      line-height: 1.5;
    }
    .btn-gold {
      margin-top: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      background: linear-gradient(135deg,#c98e10 0%,#a06e0c 100%);
      color: white;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg,#a06e0c 0%,#7a500d 100%);
      box-shadow: 0 4px 12px rgba(160,110,12,0.35);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="text-2xl mb-4">Thank you for registering!</h2>
    <p>We have received your details and someone from our team will contact you soon.</p>
    <a href="{% url 'public_member_register' %}" class="btn-gold">Back to Home</a>
  </div>
</body>
</html>
